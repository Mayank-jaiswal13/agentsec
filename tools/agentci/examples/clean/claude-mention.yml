# Hardened example: writers only, read-only token, pinned action, untrusted text never in the prompt.
name: Claude on mention
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@0123456789abcdef0123456789abcdef01234567 # FAKE-EXAMPLE pin
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Read,Grep,Bash(gh issue view:*)"
